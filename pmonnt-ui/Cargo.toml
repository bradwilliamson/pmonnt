[package]
name = "pmonnt-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
autobins = false

[dependencies]
# glow keeps the renderer PMonNT has always used (eframe now defaults to wgpu).
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "links", "persistence", "system_fonts"] }
egui = "0.37"
egui_extras = "0.37"
egui_plot = "0.38"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
pmonnt-core = { path = "../pmonnt-core" }
tokio = { version = "1.0", features = ["rt-multi-thread", "sync"] }
tokio-util = "0.7"
keyring = "4.2"
crossbeam-channel = "0.5"
num_cpus = "1.16"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Performance", "Win32_System_SystemInformation", "Win32_Graphics_Dxgi"] }
open = "5.0"
serde_json = "1.0"
rfd = "0.18"
raw-window-handle = "0.6"

[[bin]]
name = "pmonnt"
path = "src/main.rs"

[features]
dev-tools = []
