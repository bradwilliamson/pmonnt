[workspace]
members = ["pmonnt-core", "pmonnt-ui"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["PMonNT Contributors"]
license = "MIT"
repository = "https://github.com/bradwilliamson/pmonnt"
publish = false
rust-version = "1.99"

[profile.dev]
opt-level = 0
debug = 0
incremental = true
codegen-units = 16

[profile.dev.package."*"]
opt-level = 0

# Benchmarks run under Valgrind: keep symbols and line tables so Callgrind/DHAT output
# names functions, while still optimizing like a release build.
[profile.bench]
inherits = "release"
debug = true
strip = "none"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
overflow-checks = true
# Lints shared by every crate (each crate opts in with `[lints] workspace = true`).
# Beyond clippy's defaults this enables a curated set of pedantic/nursery lints that
# catch real costs (needless clones and allocations), unsafe hygiene, and modern idioms.
[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
# Unsafe hygiene
undocumented_unsafe_blocks = "warn"
cast_ptr_alignment = "warn"
borrow_as_ptr = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
# Avoidable work and allocations
redundant_clone = "warn"
assigning_clones = "warn"
implicit_clone = "warn"
cloned_instead_of_copied = "warn"
inefficient_to_string = "warn"
format_push_string = "warn"
needless_collect = "warn"
or_fun_call = "warn"
set_contains_or_insert = "warn"
unnecessary_sort_by = "warn"
stable_sort_primitive = "warn"
collection_is_never_read = "warn"
single_char_pattern = "warn"
# Correctness on Windows (file extensions are case-insensitive)
case_sensitive_file_extension_comparisons = "warn"
# Idioms
uninlined_format_args = "warn"
manual_let_else = "warn"
semicolon_if_nothing_returned = "warn"
ignored_unit_patterns = "warn"
redundant_closure_for_method_calls = "warn"
map_unwrap_or = "warn"
cast_lossless = "warn"
explicit_iter_loop = "warn"
manual_string_new = "warn"
ignore_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
